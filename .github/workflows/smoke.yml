# Runs the smoke test in real VS Code (see test/smoke/run.ts) on every platform. Only when asked,
# since it downloads VS Code each time: add the smoke-test label to a pull request (remove and add it
# again to rerun), or use Actions → Smoke test → Run workflow to try other VS Code versions.
name: Smoke test

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      versions:
        description: 'VS Code versions, separated by spaces (empty: the current release and the oldest "engines" allows)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    # Adding any other label doesn't run it.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'smoke-test'
    strategy:
      # One platform failing shouldn't hide whether the others pass.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Linux runners have no display, so VS Code gets a virtual one there. The versions come in through
      # the environment rather than being pasted into the command. Unquoted, so each is its own argument.
      - run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}npm run test:vscode -- $VERSIONS
        shell: bash
        env:
          VERSIONS: ${{ inputs.versions }}
